name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Plan CI scope
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.plan.outputs.os }}
      projects: ${{ steps.plan.outputs.projects }}
      project-count: ${{ steps.plan.outputs.project-count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          RELEASE_REF: ${{ inputs.ref }}
        run: node scripts/ci-plan.mjs
  generator:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack
      - run: pnpm test:package
      - name: Save tested npm package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: create-convex-monorepo-*.tgz
          if-no-files-found: error
          retention-days: 14
  generated-projects:
    needs: plan
    # An empty matrix is an error, so the job is skipped when nothing is planned.
    if: needs.plan.outputs.project-count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.projects) }}
    env:
      CCM_PACKAGE_MANAGER: ${{ matrix.packageManager || 'pnpm' }}
      CCM_WORKSPACE_COMMANDS: ${{ matrix.workspaceCommands || '0' }}
      CCM_EXAMPLE: ${{ matrix.example || 'messages' }}
      CCM_APPS: ${{ matrix.apps }}
      CCM_OAUTH: ${{ matrix.oauth || '' }}
      CCM_AUTH: ${{ matrix.auth }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.packageManager == 'bun'
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
  complete:
    name: CI passed
    if: always()
    needs: [plan, generator, generated-projects]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to pass
        env:
          GENERATOR_RESULT: ${{ needs.generator.result }}
          PROJECTS_RESULT: ${{ needs.generated-projects.result }}
          PROJECT_COUNT: ${{ needs.plan.outputs.project-count }}
        run: |
          test "$GENERATOR_RESULT" = success
          if test "$PROJECT_COUNT" = 0; then
            test "$PROJECTS_RESULT" = skipped
          else
            test -n "$PROJECT_COUNT" && test "$PROJECTS_RESULT" = success
          fi
