name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack
      - run: pnpm test:package
      - name: Save tested npm package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: create-convex-monorepo-*.tgz
          if-no-files-found: error
          retention-days: 14
  generated-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - apps: next
            auth: none
          - apps: vite
            auth: none
          - apps: tanstack-start
            auth: none
          - apps: expo
            auth: none
          - apps: next,expo
            auth: none
          - apps: next,expo
            auth: clerk
          - apps: vite,tanstack-start
            auth: clerk
          - apps: next,vite,tanstack-start,expo
            auth: none
            example: none
          - apps: next,vite,tanstack-start,expo
            auth: clerk
            example: none
    env:
      CCM_EXAMPLE: ${{ matrix.example || 'messages' }}
      CCM_APPS: ${{ matrix.apps }}
      CCM_AUTH: ${{ matrix.auth }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
  complete:
    name: CI passed
    if: always()
    needs: [generator, generated-projects]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to pass
        env:
          GENERATOR_RESULT: ${{ needs.generator.result }}
          PROJECTS_RESULT: ${{ needs.generated-projects.result }}
        run: test "$GENERATOR_RESULT" = success && test "$PROJECTS_RESULT" = success
